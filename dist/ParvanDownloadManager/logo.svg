<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#080D18" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <!-- Neon Cyan to Blue Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Speed Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="80%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Border -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="#1C2D4B" stroke-width="6" />
  <rect x="22" y="22" width="468" height="468" rx="108" fill="none" stroke="#00F5FF" stroke-width="2" stroke-opacity="0.35" />

  <!-- High-Tech Orbit Rings (Signal Waves) -->
  <circle cx="256" cy="225" r="165" fill="none" stroke="#00F5FF" stroke-width="2" stroke-opacity="0.18" stroke-dasharray="16 8 4 8" />
  <circle cx="256" cy="225" r="130" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- Stylized Letter P / Turbo Jet -->
  <g filter="url(#subtleGlow)">
    <!-- P Stem -->
    <rect x="155" y="115" width="46" height="235" rx="16" fill="url(#cyanBlueGrad)" />

    <!-- P Loop Arc -->
    <path d="M 185 115 H 280 C 335 115 355 155 355 195 C 355 235 330 270 280 270 H 185 Z" 
          fill="none" stroke="url(#cyanBlueGrad)" stroke-width="44" stroke-linejoin="round" />
  </g>

  <!-- Center Download Arrow Thrust -->
  <g filter="url(#neonGlow)">
    <path d="M 256 360 L 322 280 H 282 V 205 H 230 V 280 H 190 Z" fill="url(#arrowGrad)" />
    <!-- Secondary Speed Chevron -->
    <path d="M 256 405 L 292 365 H 274 L 256 385 L 238 365 H 220 Z" fill="#10B981" opacity="0.9" />
  </g>

  <!-- Pulse Center Dot -->
  <circle cx="256" cy="195" r="7" fill="#00F5FF" filter="url(#neonGlow)" />

  <!-- Clean Tech Typography -->
  <text x="256" y="462" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="34" font-weight="800" fill="#F0F4FF" letter-spacing="8">PARVAN</text>
  <text x="256" y="482" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="3">DOWNLOAD MANAGER</text>
</svg>
